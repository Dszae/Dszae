name: Profile assets

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

  generate:
    # Snake and stats cards go to the output branch; the README links to them there.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate dark and light snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Dszae
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23059669
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2334D399

      - name: Generate stats cards
        # A failure stops the job before publishing, so the last good cards stay live.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python scripts/make_stats.py --out dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge GitHub's image cache for the profile
        run: |
          node -e '
            fetch("https://github.com/Dszae")
              .then(r => r.text())
              .then(async html => {
                const urls = [...new Set(html.match(/https:\/\/camo\.githubusercontent\.com\/[a-f0-9]+\/[a-f0-9]+/g) || [])];
                console.log(`Found ${urls.length} cached images on the profile.`);
                for (const url of urls) {
                  const res = await fetch(url, { method: "PURGE" }).catch(err => ({ status: err.message }));
                  console.log(`Purged [${res.status}] ${url.slice(0, 60)}...`);
                }
              })
              .catch(err => console.log(`Purge skipped: ${err.message}`));
          '

  writing:
    # Refresh the README's Writing list from DEV; commits only when it changed.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Update the Writing list
        run: python scripts/update_writing.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh writing list" -- README.md
          git pull --rebase --quiet
          git push
