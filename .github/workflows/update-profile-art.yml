name: Update profile contribution art

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight daily dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Fetch public contribution calendar
        run: python scripts/fetch_contributions.py
      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Commit refreshed public calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          git diff --cached --quiet || git commit -m "Update contribution heatmap"
          git push
